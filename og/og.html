<!doctype html>
<!-- Link-preview card (1200×630). Regenerate og.png with: sh og/build.sh -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: repeating-linear-gradient(90deg, #e8d5b9 0 46px, #e3cdaf 46px 48px);
        color: #2e1f17;
        font-family: "Chakra Petch", sans-serif;
        position: relative;
      }
      h1 { position: absolute; left: 72px; top: 52px; margin: 0; font-size: 120px; line-height: 1; }
      p { position: absolute; left: 76px; top: 184px; margin: 0; font-size: 34px; color: #5e4636; }
      .shelf { position: absolute; left: 72px; right: 72px; bottom: 74px; display: flex; gap: 36px; padding: 0 20px; align-items: flex-end; }
      .cart { flex: 1; background: #2e1f17; border-radius: 14px 14px 4px 4px; padding: 16px 14px 18px; }
      .cart::before { content: ""; display: block; height: 10px; margin: -4px 22px 12px; background: repeating-linear-gradient(90deg, #4a3527 0 6px, transparent 6px 10px); }
      .label { background: #f2e4cf; padding: 6px; border-radius: 4px; }
      .label img { display: block; width: 100%; height: 150px; object-fit: cover; object-position: top; }
      .label b { display: block; font-size: 28px; padding: 6px 4px 0; }
      .plank { position: absolute; left: 72px; right: 72px; bottom: 44px; height: 22px; background: #a86b3c; border-bottom: 8px solid #7a4a28; }
    </style>
  </head>
  <body>
    <h1>Junior</h1>
    <p>Things I make, and where to find me</p>
    <div class="shelf">
      <div class="cart"><div class="label"><img src="../img/deskbit.jpg" style="object-position: 85% 40%" /><b>Deskbit</b></div></div>
      <div class="cart"><div class="label"><img src="../img/masu.jpg" /><b>Masu</b></div></div>
      <div class="cart"><div class="label"><img src="../img/mokhwan.jpg" /><b>Mokhwan</b></div></div>
    </div>
    <div class="plank"></div>
  </body>
</html>
